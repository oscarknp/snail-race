# nginx reverse proxy for Snail Race.
# 1. Replace snails.example.com (twice) with your domain and point its DNS at this server.
# 2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/snail-race
#    sudo ln -s /etc/nginx/sites-available/snail-race /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. Add HTTPS: sudo certbot --nginx -d snails.example.com
#    (certbot edits this file to add the certificate and the http -> https redirect.)
server {
    listen 80;
    listen [::]:80;
    server_name snails.example.com;

    # Profile photos are uploaded through the app (max 5 MB); nginx's default limit is 1 MB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app reads X-Real-IP (or the last X-Forwarded-For entry) for rate limiting
        # when TRUST_PROXY=true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
